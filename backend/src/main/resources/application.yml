spring:
  application:
    name: flstudio-plugin-organizer
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      base-path: /manage
      path-mapping:
        health: /health
      exposure:
        include:
          - health

server:
  port: 8088

config:
  allowedOrigins: http://localhost:3000,http://localhost,https://frontend.flstudio-plugin-organizer.orb.local 
